name: Continuos delivery

on:
  push:
    branches:
      - main

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:

      - name: Check out repository code
        uses: actions/checkout@v6

      - name: simulando delivery
        uses: actions/upload-artifact@v7
        with:
          name: projeto-zipado.zip
          path: |
            main.py
            readme.md

  deploy:
    runs-on: ubuntu-latest
    needs: deliver
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: projeto-zipado.zip

      - name: Display structure of downloaded files
        run: ls -R

  discord:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verificar webhook
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "ERRO: DISCORD_WEBHOOK está vazio."
            exit 1
          fi
          
          echo "Webhook encontrado."
          echo "Tamanho do webhook: ${#DISCORD_WEBHOOK}"

      - name: Enviar alerta para Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD }}
        run: |
          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -X POST \
            --data-raw '{"content":"🚀 GitHub Actions executado com sucesso!"}' \
            "$DISCORD_WEBHOOK"
            "$DISCORD_WEBHOOK"